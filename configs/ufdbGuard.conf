squid-version "5.7"
redirect-https "noconnect.urlfilterdb.com:443"

socket-type tcp
port 3977
interface 127.0.0.1
refreshuserlist 5

dbhome "/var/ufdbguard/blacklists"
logdir "/var/ufdbguard/logs"
logblock on
logpass on
pidfile "/run/ufdbguard/ufdbguardd.pid"

check-proxy-tunnels off


#
#==============================================
# Departments
#==============================================
#

source HR {
        execuserlist "/usr/local/ufdbguard/scripts/HR-users.sh"
}


source SALES {
        execuserlist "/usr/local/ufdbguard/scripts/Sales-users.sh"
}



#
#==============================================
# BLOCKED CATEGORY
#==============================================
#


category Rule_Social {
        domainlist "Rule_Social/domains"
}

category Rule_Linkedin {
        domainlist "Rule_Linkedin/domains"
}

category Rule_Streaming {
        domainlist "Rule_Streaming/domains"
}

category Rule_Adult {
        domainlist "Rule_Adult/domains"
}


#
#==============================================
# Break Time
#==============================================
#

time "LUNCH" {
        weekly mon,tue,wed,thu,fri 12:00 - 13:30
}


#
# ============================================================
# POLICY
# ============================================================
#

acl {

        #
        # ----------------------------------------------------
        # HR
        # ----------------------------------------------------
        #

        HR within "LUNCH" {
                pass any
        } else {
                pass
                        !Rule_Social
                        !Rule_Streaming
                        !Rule_Adult
                        Rule_Linkedin
                        any
        }
        #
        # ----------------------------------------------------
        # SALES
        # ----------------------------------------------------
        #

        SALES within "LUNCH" {
                pass any
        } else {
                pass
                        !Rule_Social
                        !Rule_Streaming
                        !Rule_Adult
                        !Rule_Linkedin
                        any
        }
        #
        # ----------------------------------------------------
        # DEFAULT
        # ----------------------------------------------------
        #

        default {
                pass any
        }
}