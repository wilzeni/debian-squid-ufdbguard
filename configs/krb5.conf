[libdefaults]
        default_realm = EXAMPLE.LOCAL

        kdc_timesync = 1
        ccache_type = 4
        forwardable = true
        proxiable = true
        rdns = false
        fcc-mit-ticketflags = true

[realms]
        EXAMPLE.LOCAL = {
                kdc = dns_ip
                admin_server = dns_ip
        }

[domain_realm]
        .example.local = EXAMPLE.LOCAL
        example.local = EXAMPLE.LOCAL